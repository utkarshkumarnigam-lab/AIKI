<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#12122b"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#b44aff"/>
    </linearGradient>
    <linearGradient id="visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d78"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#bg)" stroke="#00f5ff" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Cyber Corner Accents -->
  <path d="M 8 16 L 8 8 L 16 8" stroke="#ff2d78" stroke-width="2" fill="none"/>
  <path d="M 48 8 L 56 8 L 56 16" stroke="#00f5ff" stroke-width="2" fill="none"/>
  <path d="M 56 48 L 56 56 L 48 56" stroke="#ff2d78" stroke-width="2" fill="none"/>
  <path d="M 16 56 L 8 56 L 8 48" stroke="#00f5ff" stroke-width="2" fill="none"/>

  <!-- AIKI Robot Head Frame -->
  <rect x="18" y="16" width="28" height="32" rx="4" fill="#181836" stroke="url(#cyan-glow)" stroke-width="2"/>
  
  <!-- Visor Screen -->
  <rect x="22" y="22" width="20" height="12" rx="2" fill="url(#visor-grad)" filter="url(#glow)"/>
  
  <!-- Visor Dual Eye Lights -->
  <circle cx="27" cy="28" r="2" fill="#ffffff"/>
  <circle cx="37" cy="28" r="2" fill="#ffffff"/>

  <!-- Core Circuit Node -->
  <circle cx="32" cy="40" r="3" fill="#00f5ff" filter="url(#glow)"/>
  <line x1="32" y1="37" x2="32" y2="34" stroke="#00f5ff" stroke-width="1.5"/>

  <!-- Signal Antennae -->
  <line x1="22" y1="16" x2="18" y2="10" stroke="#00f5ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="17" cy="9" r="1.5" fill="#00f5ff"/>
  <line x1="42" y1="16" x2="46" y2="10" stroke="#ff2d78" stroke-width="2" stroke-linecap="round"/>
  <circle cx="47" cy="9" r="1.5" fill="#ff2d78"/>
</svg>
